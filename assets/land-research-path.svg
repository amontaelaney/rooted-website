<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">Land research pathway</title><desc id="desc">Begin with learning needs, investigate site essentials, verify resource evidence and assess feasibility before choosing land.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#427f86"/></marker></defs><rect width="1100" height="620" rx="24" fill="#e6ece2"/><text x="550" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#273b30">Read the land before choosing the place</text><path d="M100 300C230 80 390 510 550 300S850 80 1000 300" fill="none" stroke="#b4ccca" stroke-width="28"/><path d="M100 300C230 80 390 510 550 300S850 80 1000 300" fill="none" stroke="#427f86" stroke-width="3" stroke-dasharray="5 12"/><g><rect x="45" y="100" width="220" height="145" rx="16" fill="#fffaf0" stroke="#b8c6ae"/><circle cx="75" cy="130" r="16" fill="#dce9e6"/><text x="75" y="135" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#296e79">1</text><text x="155" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#273b30">Learning needs</text><text x="155" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52634d"><tspan x="155" dy="25">People, access,</tspan><tspan x="155" dy="25">space and support</tspan></text></g><g><rect x="305" y="365" width="220" height="145" rx="16" fill="#fffaf0" stroke="#b8c6ae"/><circle cx="335" cy="395" r="16" fill="#dce9e6"/><text x="335" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#296e79">2</text><text x="415" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#273b30">Site essentials</text><text x="415" y="437" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52634d"><tspan x="415" dy="25">Water, soil, utilities</tspan><tspan x="415" dy="25">and existing buildings</tspan></text></g><g><rect x="575" y="100" width="220" height="145" rx="16" fill="#fffaf0" stroke="#b8c6ae"/><circle cx="605" cy="130" r="16" fill="#dce9e6"/><text x="605" y="135" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#296e79">3</text><text x="685" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#273b30">Resource evidence</text><text x="685" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52634d"><tspan x="685" dy="25">Verify geothermal</tspan><tspan x="685" dy="25">temperature and flow</tspan></text></g><g><rect x="835" y="365" width="220" height="145" rx="16" fill="#fffaf0" stroke="#b8c6ae"/><circle cx="865" cy="395" r="16" fill="#dce9e6"/><text x="865" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#296e79">4</text><text x="945" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#273b30">Feasibility</text><text x="945" y="437" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52634d"><tspan x="945" dy="25">Permissions, costs</tspan><tspan x="945" dy="25">and stewardship</tspan></text></g><text x="550" y="585" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#52634d">Research framework only · No parcel selected or geothermal resource confirmed</text></svg>