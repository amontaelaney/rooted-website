<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">A nutrient learning loop</title><desc id="desc">Grow plants, harvest and share, collect suitable plant scraps for worms, and return finished vermicompost to soil growing.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#427f86"/></marker></defs><rect width="1100" height="620" rx="24" fill="#e6ece2"/><text x="550" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#273b30">Follow the nutrients</text><g><rect x="110" y="100" width="220" height="145" rx="16" fill="#fffaf0" stroke="#b8c6ae"/><circle cx="140" cy="130" r="16" fill="#dce9e6"/><text x="140" y="135" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#296e79">1</text><text x="220" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#273b30">Grow</text><text x="220" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52634d"><tspan x="220" dy="25">Plants use water,</tspan><tspan x="220" dy="25">light and nutrients</tspan></text></g><g><rect x="770" y="100" width="220" height="145" rx="16" fill="#fffaf0" stroke="#b8c6ae"/><circle cx="800" cy="130" r="16" fill="#dce9e6"/><text x="800" y="135" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#296e79">2</text><text x="880" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#273b30">Harvest &amp; share</text><text x="880" y="172" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52634d"><tspan x="880" dy="25">Food connects growers</tspan><tspan x="880" dy="25">and community</tspan></text></g><g><rect x="770" y="375" width="220" height="145" rx="16" fill="#fffaf0" stroke="#b8c6ae"/><circle cx="800" cy="405" r="16" fill="#dce9e6"/><text x="800" y="410" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#296e79">3</text><text x="880" y="440" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#273b30">Collect plant scraps</text><text x="880" y="447" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52634d"><tspan x="880" dy="25">Suitable scraps feed</tspan><tspan x="880" dy="25">a managed worm bin</tspan></text></g><g><rect x="110" y="375" width="220" height="145" rx="16" fill="#fffaf0" stroke="#b8c6ae"/><circle cx="140" cy="405" r="16" fill="#dce9e6"/><text x="140" y="410" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#296e79">4</text><text x="220" y="440" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#273b30">Build healthy soil</text><text x="220" y="447" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#52634d"><tspan x="220" dy="25">Finished vermicompost</tspan><tspan x="220" dy="25">can support soil growing</tspan></text></g><g fill="none" stroke="#427f86" stroke-width="4" marker-end="url(#arrow)"><path d="M345 172H750"/><path d="M880 260V355"/><path d="M750 450H350"/><path d="M220 355V265"/></g><text x="550" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#a65132">Observe. Ask. Try again.</text><text x="550" y="335" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#52634d">A learning loop, not a complete production system</text></svg>